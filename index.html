<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Puzzle Quiz Game</title>
<style>
:root{
  --bg:#1a1a2e; --accent:#00d4ff; --correct:#10b981; --wrong:#ef4444; --muted:#aaa;
  --opt1:#ff6b6b; --opt2:#4ecdc4; --opt3:#f7b801; --opt4:#9b5de5;
}
body{
  margin:0; font-family:Arial, sans-serif; background:var(--bg); color:#fff; display:flex; justify-content:center; padding:20px;
}
.wrap{max-width:700px; width:100%; display:flex; flex-direction:column; gap:20px;}
header{background:#0f0f1a; padding:20px; border-radius:12px; text-align:center;}
h1{color:var(--accent); margin:0; font-size:28px;}
.card{background:rgba(255,255,255,0.05); padding:20px; border-radius:12px;}
.question{font-size:20px; font-weight:700; margin-bottom:14px;}
.options{display:flex; flex-direction:column; gap:10px;}
button.opt{padding:12px 16px; border:none; border-radius:10px; font-weight:700; font-size:16px; cursor:pointer; color:#fff; transition:0.12s;}
button.opt:nth-child(1){background:var(--opt1);}
button.opt:nth-child(2){background:var(--opt2);}
button.opt:nth-child(3){background:var(--opt3);}
button.opt:nth-child(4){background:var(--opt4);}
button.opt:hover{transform:translateY(-2px);}
button.opt:disabled{opacity:0.8; cursor:default; transform:none;}
.correct{background:var(--correct)!important;}
.wrong{background:var(--wrong)!important;}
.controls{display:flex; justify-content:flex-end; margin-top:14px;}
.next{padding:10px 18px; border:none; border-radius:10px; font-weight:700; cursor:pointer; background:var(--accent); color:#001;}
.result{font-size:22px; font-weight:700; text-align:center;}
.small{font-size:14px; color:var(--muted); text-align:center; margin-top:10px;}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>Puzzle Quiz Challenge</h1>
</header>

<section id="quizCard" class="card">
  <div id="contentArea"></div>
  <div class="controls" id="controls" style="display:none">
    <button id="nextBtn" class="next">Next</button>
  </div>
</section>

<section id="resultCard" class="card" style="display:none">
  <div class="result" id="resultContent"></div>
  <div class="small">You can refresh the page to play again.</div>
</section>
</div>

<script>
// Project-related puzzle questions
const QUESTIONS = [
  {q:"Which data structure is best for LIFO operations?", opts:["Queue","Stack","Array","Graph"], a:1},
  {q:"Which sorting algorithm is fastest on average for large datasets?", opts:["Bubble Sort","Quick Sort","Insertion Sort","Selection Sort"], a:1},
  {q:"Which protocol is used to securely browse the web?", opts:["HTTP","FTP","HTTPS","SMTP"], a:2},
  {q:"Which database is document-based?", opts:["MySQL","PostgreSQL","MongoDB","SQLite"], a:2},
  {q:"Which CSS property changes text color?", opts:["background-color","font-size","color","margin"], a:2},
  {q:"Which Git command creates a new branch?", opts:["git init","git branch","git commit","git merge"], a:1},
  {q:"Which HTML tag defines a table row?", opts:["<td>","<tr>","<th>","<table>"], a:1},
  {q:"Which JS function parses JSON strings?", opts:["JSON.parse()","JSON.stringify()","eval()","parseInt()"], a:0},
  {q:"Which keyword declares a constant in JS?", opts:["let","var","const","function"], a:2},
  {q:"Which symbol is used for ID selectors in CSS?", opts:[".","#","$","@"], a:1}
];

let index=0, score=0;
const contentArea=document.getElementById('contentArea');
const controls=document.getElementById('controls');
const nextBtn=document.getElementById('nextBtn');
const quizCard=document.getElementById('quizCard');
const resultCard=document.getElementById('resultCard');
const resultContent=document.getElementById('resultContent');

function renderQuestion(i){
  const item=QUESTIONS[i];
  contentArea.innerHTML=`<div class="question">Q${i+1}. ${item.q}</div>
    <div class="options" id="opts"></div>`;
  const optsDiv=document.getElementById('opts');
  item.opts.forEach((opt, idx)=>{
    const b=document.createElement('button'); b.className='opt'; b.innerText=opt;
    b.onclick=()=>handleAnswer(b, idx, item.a); optsDiv.appendChild(b);
  });
  controls.style.display='flex'; nextBtn.style.display='none';
}

function handleAnswer(button, chosen, correct){
  document.querySelectorAll('.opt').forEach(b=>b.disabled=true);
  if(chosen===correct){button.classList.add('correct'); score++;}
  else{button.classList.add('wrong'); document.querySelectorAll('.opt')[correct].classList.add('correct');}
  nextBtn.style.display='inline-block';
  nextBtn.innerText=(index===QUESTIONS.length-1)?'Finish':'Next';
}

nextBtn.addEventListener('click', ()=>{
  index++;
  if(index<QUESTIONS.length){renderQuestion(index);}
  else{showResults();}
});

function showResults(){
  quizCard.style.display='none';
  resultCard.style.display='block';
  resultContent.innerText=`You solved ${score} out of ${QUESTIONS.length} puzzles correctly!`;
}

// Initial render
renderQuestion(index);
</script>
</body>
</html>
