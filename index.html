<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brevis Network Quiz — Play & Earn Art</title>
<style>
:root{
  --bg1:#06061a; --accent1:#00d4ff; --accent2:#7c3aed; --muted:#9aa4b2;
  --opt1:#ff6b6b; --opt2:#4ecdc4; --opt3:#f7b801; --opt4:#9b5de5;
}
body{
  margin:0; font-family:Inter, sans-serif;
  background:linear-gradient(180deg,var(--bg1),#031025); color:#fff; display:flex; justify-content:center; padding:20px;
}
.wrap{max-width:920px;width:100%; display:flex; flex-direction:column; gap:18px;}
header{background:#000;padding:22px;border-radius:14px;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,0.6);}
h1{font-size:36px;color:var(--accent1); margin:0;text-shadow:0 4px 18px rgba(0,212,255,0.06);}
.sub{font-size:18px;color:var(--muted);margin-top:8px;font-weight:700;}
.card{background:rgba(255,255,255,0.02);padding:18px;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,0.6);}
.question{font-size:20px;font-weight:700;padding:12px;border-radius:10px;background:linear-gradient(90deg,#06112600,#00000000);}
.options{display:flex; flex-direction:column; gap:10px;margin-top:12px;}
button.opt{padding:14px 16px;border-radius:12px;border:none;font-weight:700;font-size:16px;cursor:pointer;color:#fff;transition:0.12s;}
button.opt:nth-child(1){background:var(--opt1);}
button.opt:nth-child(2){background:var(--opt2);}
button.opt:nth-child(3){background:var(--opt3);}
button.opt:nth-child(4){background:var(--opt4);}
button.opt:hover{transform:translateY(-3px); box-shadow:0 8px 20px rgba(0,0,0,0.3);}
button.opt:disabled{opacity:0.86;cursor:default;transform:none;}
.correct{box-shadow:0 8px 18px rgba(16,185,129,0.4)!important;border:2px solid #10b981!important;}
.wrong{box-shadow:0 8px 18px rgba(239,68,68,0.4)!important;border:2px solid #ef4444!important;}
.controls{display:flex; justify-content:space-between; align-items:center; margin-top:14px;}
.next{background:linear-gradient(90deg,var(--accent1),var(--accent2));border:none;color:#001;padding:12px 22px;border-radius:12px;font-weight:800;cursor:pointer;box-shadow:0 8px 24px rgba(0,212,255,0.12);}
.resultCard{display:flex;flex-direction:column;gap:12px;align-items:center;padding:22px;}
.score{font-size:24px;font-weight:900;color:var(--accent1);}
.trophy{font-size:96px;margin-top:6px;}
.rewardImg{width:100%;max-width:560px;border-radius:12px;box-shadow:0 14px 40px rgba(0,0,0,0.6);}
.shareRow{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;}
.btn{padding:10px 14px;border-radius:12px;border:none;cursor:pointer;font-weight:700;}
.downloadBtn{background:var(--accent1);color:#001;}
.shareBtn{background:var(--accent2);color:#fff;}
.small{font-size:13px;color:var(--muted);}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>Play the Game — Earn Memes & Art</h1>
  <div class="sub">Test your knowledge and unlock exclusive rewards!</div>
</header>

<section id="quizCard" class="card">
  <div id="contentArea"></div>
  <div class="controls" id="controls" style="display:none">
    <div class="progress" id="progressText">Question 1/10</div>
    <button id="nextBtn" class="next">Next</button>
  </div>
</section>

<section id="resultCard" class="card" style="display:none">
  <div class="resultCard" id="resultContent"></div>
</section>
</div>

<script>
// Questions
const QUESTIONS = [
  {q:"What technology does Brevis use to prove computations privately?", opts:["Zero-knowledge proofs","Proof-of-work","Federated learning","Differential privacy"], a:0},
  {q:"Approximate gas size for large Ethereum blocks in Pico Prism?", opts:["~45M","~1M","~500","~100B"], a:1},
  {q:"Benefit of proving on consumer hardware?", opts:["Lower costs","High power","Centralization","Less security"], a:0},
  {q:"Why real-time proving important?", opts:["Quick verification on-chain","Increases token supply","Slows consensus","Reduces decentralization"], a:0},
  {q:"Aim of Brevis zk work?", opts:["Private verifiable computation","Create social network","Mine more coins","Replace smart contracts"], a:2},
  {q:"FHE allows what similar to zk-proofs?", opts:["Compute encrypted data","Faster graphics","Unlimited storage","Messaging"], a:0},
  {q:"Pico Prism improvements affect?", opts:["Prover performance","Wallet UI","Token economics","Animations"], a:0},
  {q:"Practical goal of real-time proving?", opts:["Cheap frequent proofs","Remove consensus","Increase gas","Stop contracts"], a:0},
  {q:"Primary target chain?", opts:["Ethereum","Bitcoin","XRP Ledger","Monero"], a:0},
  {q:"Benefit of faster/cheaper proofs?", opts:["Private scalable dApps","Slower apps","Central servers","Large wallets"], a:0}
];

// Art & Memes online URLs
const ART_URLS = Array.from({length:30}, (_,i)=>`https://via.placeholder.com/560x320.png?text=Art+${i+1}`);
const MEME_URLS = Array.from({length:10}, (_,i)=>`https://via.placeholder.com/400x400.png?text=Meme+${i+1}`);

let index=0, score=0;
const contentArea=document.getElementById('contentArea');
const controls=document.getElementById('controls');
const nextBtn=document.getElementById('nextBtn');
const progressText=document.getElementById('progressText');
const resultCard=document.getElementById('resultCard');
const resultContent=document.getElementById('resultContent');
const quizCard=document.getElementById('quizCard');

function renderQuestion(i){
  const item=QUESTIONS[i];
  contentArea.innerHTML=`<div class="question"><strong>Q${i+1}. ${escapeHtml(item.q)}</strong></div>
  <div class="options" id="opts"></div>`;
  const optsDiv=document.getElementById('opts');
  item.opts.forEach((opt, idx)=>{
    const b=document.createElement('button');
    b.className='opt';
    b.innerHTML=`<span style="font-weight:800">${String.fromCharCode(65+idx)}.</span> ${escapeHtml(opt)}`;
    b.onclick=()=>handleAnswer(b, idx, item.a);
    optsDiv.appendChild(b);
  });
  controls.style.display='flex';
  progressText.textContent=`Question ${i+1} / ${QUESTIONS.length}`;
  nextBtn.style.display='none';
}

function handleAnswer(button, chosen, correct){
  document.querySelectorAll('.opt').forEach(b=>b.disabled=true);
  if(chosen===correct){button.classList.add('correct'); score++;} 
  else{button.classList.add('wrong'); const correctBtn=document.querySelectorAll('.opt')[correct]; if(correctBtn) correctBtn.classList.add('correct');}
  nextBtn.style.display='inline-block';
  nextBtn.textContent=(index===QUESTIONS.length-1)?'Finish':'Next';
}

nextBtn.addEventListener('click', ()=>{
  index++; if(index<QUESTIONS.length){renderQuestion(index);} 
  else{showResults();}
});

function showResults(){
  quizCard.style.display='none';
  resultCard.style.display='block';
  resultContent.innerHTML='';
  
  const scoreDiv=document.createElement('div'); scoreDiv.className='score';
  scoreDiv.innerHTML=`Your score: <strong>${score}/${QUESTIONS.length}</strong>`; resultContent.appendChild(scoreDiv);
  
  const trophy=document.createElement('div'); trophy.className='trophy';
  trophy.textContent=(score>=7)?'🏆':'🔒'; resultContent.appendChild(trophy);
  
  const small=document.createElement('div'); small.className='small';
  small.textContent=(score>=7)?'Congrats! You qualified for a Brevis art reward.':'Try again to win Brevis art!'; resultContent.appendChild(small);

  if(score>=7){
    const artIndex=Math.floor(Math.random()*ART_URLS.length);
    const artPath=ART_URLS[artIndex];
    const img=document.createElement('img'); img.className='rewardImg'; img.src=artPath; img.alt='Reward Art';
    resultContent.appendChild(img);

    const row=document.createElement('div'); row.className='shareRow';
    const dl=document.createElement('a'); dl.href=artPath; dl.download=`brevis-art-${artIndex+1}.png`;
    const dlbtn=document.createElement('button'); dlbtn.className='btn downloadBtn'; dlbtn.textContent='⬇️ Download Art'; dl.appendChild(dlbtn); row.appendChild(dl);

    const memeIndex=Math.floor(Math.random()*MEME_URLS.length);
    const memePath=MEME_URLS[memeIndex];
    const dlM=document.createElement('a'); dlM.href=memePath; dlM.download=`brevis-meme-${memeIndex+1}.png`;
    const dlMbtn=document.createElement('button'); dlMbtn.className='btn downloadBtn'; dlMbtn.textContent='⬇️ Download Meme'; dlM.appendChild(dlMbtn); row.appendChild(dlM);

    const shareBtn=document.createElement('button'); shareBtn.className='btn shareBtn'; shareBtn.textContent='🐦 Share on X';
    shareBtn.onclick=()=>{ const text=`I unlocked Brevis art and meme on the Brevis Network! #BrevisChallenge → @anshulgautam360`; 
      window.open(`https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}`, '_blank');};
    row.appendChild(shareBtn);

    resultContent.appendChild(row);
  } else{
    const tryBtn=document.createElement('button'); tryBtn.className='next'; tryBtn.textContent='Try Again';
    tryBtn.onclick=()=>location.reload(); resultContent.appendChild(tryBtn);
  }
}

function escapeHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
renderQuestion(index);
</script>
</body>
</html>
